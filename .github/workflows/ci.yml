name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type check, API tests and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          npm install --prefix client --no-audit --no-fund

      - name: Build the front end
        run: node client/build.js

      - name: Type check (TypeScript over the server's JavaScript)
        run: npm run typecheck

      - name: API tests (Node built-in SQLite)
        run: npm test

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests (phone and desktop)
        run: npm run e2e

      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker Compose starts the site with MySQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build and start
        run: docker compose up --build -d

      - name: Wait for the site
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/health; then echo; break; fi
            sleep 3
          done
          curl -sf http://127.0.0.1:3000/api/health

      - name: Home and a car page answer, with the sample stock loaded
        run: |
          curl -sf -o /dev/null http://127.0.0.1:3000/
          slug=$(curl -sf "http://127.0.0.1:3000/api/cars?limit=all" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const c=JSON.parse(s).cars;if(!c.length)process.exit(1);console.log(c[0].slug)})")
          curl -sf -o /dev/null "http://127.0.0.1:3000/cars/$slug"
          echo "OK: /cars/$slug"

      - name: Logs if it failed
        if: failure()
        run: docker compose logs --tail=200
