name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type check, API tests and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          npm install --prefix client --no-audit --no-fund

      - name: Build the front end
        run: node client/build.js

      - name: Type check (TypeScript over the server's JavaScript)
        run: npm run typecheck

      - name: API tests (Node built-in SQLite)
        run: npm test

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests (phone and desktop)
        run: npm run e2e

      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
