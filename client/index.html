<script nonce="__NONCE__">
/* While the app loads, the light server page stays hidden (no flash). If the app has not started after 6 seconds,
   or its file fails to download, the light page is shown so the visitor still sees cars, prices and contacts. */
(function(){var d=document.documentElement;d.classList.add('js');function show(){if(!window.__kcMounted)d.classList.remove('js');}
setTimeout(show,6000);window.addEventListener('error',function(e){var t=e.target;if(t&&t.tagName==='SCRIPT')show();},true);})();
</script>
